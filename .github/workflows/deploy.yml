name: Deploy to Surge

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish to Surge
        run: npx --yes surge . kunuz.surge.sh
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
