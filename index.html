<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>كنوز</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/index.css">
</head>
<body>
<div class="container">
  <h1>كنوز</h1>
  <div class="grid" id="rooms"></div>
</div>
<script>
  fetch('data/rooms.json').then(r=>r.json()).then(rooms=>{
    const grid=document.getElementById('rooms');
    rooms.forEach(room=>{
      const a=document.createElement('a');
      a.className='room';
      a.href=`room.html?room=${room.id}`;
      a.innerHTML=`
        <img src="${room.image}" alt="${room.title.ar}">
        <h2>${room.title.ar}</h2>
        <p>${room.title.en}</p>
      `;
      grid.appendChild(a);
    });
  });
</script>
  <footer class="site-footer">
        <p>
              <a href="https://github.com/TryingCS/kunuz" target="_blank" rel="noreferrer">View on GitHub</a>
        </p>
    </footer>
</body>
</html>
