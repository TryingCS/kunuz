<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>كنوز</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;min-height:100vh;background:#efe9dc;color:#4a3320;font-family:"Amiri",serif}
  .container{max-width:1200px;margin:0 auto;padding:2rem}
  h1{text-align:center;font-family:"Aref Ruqaa",serif;font-size:2.5rem;margin-bottom:2rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1.5rem}  .room{background:#f7efdd;border:2px solid #4a3320;border-radius:8px;padding:1.5rem;text-decoration:none;color:inherit;transition:transform .2s}
  .room:hover{transform:translateY(-4px)}
  .room img{width:100%;border-radius:4px;margin-bottom:1rem}
  .room h2{margin:0 0 .5rem;font-size:1.5rem}
  .room p{margin:0;font-size:.9rem;opacity:.8}
</style>
</head>
<body>
<div class="container">
  <h1>كنوز</h1>
  <div class="grid" id="rooms"></div>
</div>
<script>
  fetch('data/rooms.json').then(r=>r.json()).then(rooms=>{
    const grid=document.getElementById('rooms');
    rooms.forEach(room=>{
      const a=document.createElement('a');
      a.className='room';
      a.href=`room.html?room=${room.id}`;
      a.innerHTML=`
        <img src="${room.image}" alt="${room.title.ar}">
        <h2>${room.title.ar}</h2>
        <p>${room.title.en}</p>
      `;
      grid.appendChild(a);
    });
  });
</script>
</body>
</html>
